name: sgar_ddi

channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.7.12
  - pytorch=1.9.0
  - cudatoolkit=11.1
  - rdkit=2020.09.1
  - numpy=1.21.6
  - pandas=1.3.5
  - scikit-learn=1.0.2
  - scipy=1.7.3
  - pip
  - pip:
      - -f https://data.pyg.org/whl/torch-1.9.0+cu111.html
      - torch-scatter==2.0.8
      - torch-sparse==0.6.12
      - torch-cluster==1.5.9
      - torch-spline-conv==1.2.1
      - torch-geometric==2.0.3
